# ==========================================================
# Apache Flume - e-commerce
#
# Source:
#   eventos JSON produzidos continuamente pelo gerador.
#
# Fan-out:
#   1) HDFS para armazenamento bruto.
#   2) FileRoll para disponibilizar o stream ao Apache Flink.
# ==========================================================

a1.sources = r1
a1.channels = c_hdfs c_flink
a1.sinks = k_hdfs k_flink

# ==========================================================
# SOURCE
# ==========================================================

a1.sources.r1.type = exec
a1.sources.r1.command = tail -n 0 -F /data/events.log
a1.sources.r1.shell = /bin/bash -c

# Cada evento é replicado para os dois canais.
a1.sources.r1.channels = c_hdfs c_flink
a1.sources.r1.selector.type = replicating

# ==========================================================
# CHANNEL 1 - HDFS
# ==========================================================

a1.channels.c_hdfs.type = memory
a1.channels.c_hdfs.capacity = 10000
a1.channels.c_hdfs.transactionCapacity = 1000

# ==========================================================
# CHANNEL 2 - FLINK
# ==========================================================

a1.channels.c_flink.type = memory
a1.channels.c_flink.capacity = 10000
a1.channels.c_flink.transactionCapacity = 1000

# ==========================================================
# SINK 1 - HDFS
# ==========================================================

a1.sinks.k_hdfs.type = hdfs
a1.sinks.k_hdfs.channel = c_hdfs

a1.sinks.k_hdfs.hdfs.path = hdfs://namenode:9000/bigdata/ecommerce/raw/%Y/%m/%d/%H
a1.sinks.k_hdfs.hdfs.filePrefix = events-
a1.sinks.k_hdfs.hdfs.fileSuffix = .jsonl
a1.sinks.k_hdfs.hdfs.useLocalTimeStamp = true

a1.sinks.k_hdfs.hdfs.fileType = DataStream
a1.sinks.k_hdfs.hdfs.writeFormat = Text

a1.sinks.k_hdfs.hdfs.rollInterval = 10
a1.sinks.k_hdfs.hdfs.rollSize = 0
a1.sinks.k_hdfs.hdfs.rollCount = 0
a1.sinks.k_hdfs.hdfs.minBlockReplicas = 1

# ==========================================================
# SINK 2 - ENTRADA DO FLINK
# ==========================================================

a1.sinks.k_flink.type = file_roll
a1.sinks.k_flink.channel = c_flink

a1.sinks.k_flink.sink.directory = /stream
a1.sinks.k_flink.sink.rollInterval = 5