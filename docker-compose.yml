services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    restart: unless-stopped

    ports:
      - "9870:9870"
      - "9000:9000"

    environment:
      CLUSTER_NAME: bigdata-ecommerce

    env_file:
      - ./hadoop.env

    volumes:
      - hadoop_namenode:/hadoop/dfs/name

    networks:
      - bigdata-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    restart: unless-stopped

    depends_on:
      - namenode

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    env_file:
      - ./hadoop.env

    volumes:
      - hadoop_datanode:/hadoop/dfs/data

    networks:
      - bigdata-net

  generator:
    image: python:3.11-slim
    container_name: generator
    hostname: generator
    restart: unless-stopped

    working_dir: /app

    command:
      - python
      - /app/generator/gerador.py
      - --output
      - /data/events.log
      - --interval
      - "1"

    volumes:
      - ./:/app:ro
      - event_data:/data

    networks:
      - bigdata-net

  promoter:
    image: python:3.11-slim
    container_name: stream-promoter
    hostname: stream-promoter
    restart: unless-stopped

    working_dir: /app

    command:
      - python
      - /app/scripts/promote_stream_files.py

    volumes:
      - ./:/app:ro
      - stream_data:/stream

    networks:
      - bigdata-net

  flume:
    build:
      context: .
      dockerfile: flume/Dockerfile

    container_name: flume
    hostname: flume
    restart: unless-stopped

    depends_on:
      - namenode
      - datanode
      - promoter

    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"

    env_file:
      - ./hadoop.env

    volumes:
      - ./:/opt/project:ro
      - event_data:/data
      - stream_data:/stream

    networks:
      - bigdata-net

  jobmanager:
    image: flink:1.17.2-scala_2.12-java11
    container_name: flink-jobmanager
    hostname: jobmanager
    command: jobmanager
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 768m
        parallelism.default: 1

    volumes:
      - stream_data:/stream:ro
      - ./flink:/opt/project/flink:ro

    networks:
      - bigdata-net

  taskmanager:
    image: flink:1.17.2-scala_2.12-java11
    container_name: flink-taskmanager
    hostname: taskmanager
    command: taskmanager
    restart: unless-stopped

    depends_on:
      - jobmanager

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 1
        taskmanager.memory.process.size: 1024m
        parallelism.default: 1

    volumes:
      - stream_data:/stream:ro
      - ./flink:/opt/project/flink:ro

    networks:
      - bigdata-net

  hbase:
    image: bde2020/hbase-standalone:1.0.0-hbase1.2.6
    container_name: hbase
    hostname: hbase
    restart: unless-stopped

    depends_on:
      - namenode
      - datanode

    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"

      HBASE_CONF_hbase_rootdir: hdfs://namenode:9000/hbase
      HBASE_CONF_hbase_cluster_distributed: "false"
      HBASE_CONF_hbase_zookeeper_property_dataDir: /zookeeper-data
      HBASE_CONF_hbase_zookeeper_quorum: hbase

      HBASE_CONF_hbase_regionserver_hlog_tolerable_lowreplication: "1"

      HBASE_CONF_hbase_master_port: "16000"
      HBASE_CONF_hbase_master_info_port: "16010"
      HBASE_CONF_hbase_regionserver_port: "16020"
      HBASE_CONF_hbase_regionserver_info_port: "16030"

      HBASE_CONF_hbase_zookeeper_peerport: "2888"
      HBASE_CONF_hbase_zookeeper_leaderport: "3888"
      HBASE_CONF_hbase_zookeeper_property_clientPort: "2181"

    ports:
      - "16010:16010"
      - "16030:16030"
      - "2181:2181"

    volumes:
      - hbase_data:/hbase-data
      - hbase_zookeeper_data:/zookeeper-data

    networks:
      - bigdata-net

  hbase-rest:
    image: bde2020/hbase-standalone:1.0.0-hbase1.2.6
    container_name: hbase-rest
    hostname: hbase-rest
    restart: unless-stopped

    depends_on:
      - hbase

    command:
      - hbase
      - rest
      - start
      - -p
      - "8080"

    environment:
      SERVICE_PRECONDITION: "hbase:2181"

      HBASE_CONF_hbase_zookeeper_quorum: hbase
      HBASE_CONF_hbase_zookeeper_property_clientPort: "2181"
      HBASE_CONF_hbase_rootdir: hdfs://namenode:9000/hbase
      HBASE_CONF_hbase_cluster_distributed: "false"

    ports:
      - "8082:8080"

    networks:
      - bigdata-net

  spark-master:
    image: bde2020/spark-master:3.0.0-hadoop3.2
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped

    depends_on:
      - namenode
      - datanode

    environment:
      INIT_DAEMON_STEP: setup_spark

    ports:
      - "8083:8080"
      - "7077:7077"

    volumes:
      - ./spark:/opt/project/spark:ro

    networks:
      - bigdata-net

  spark-worker:
    image: bde2020/spark-worker:3.0.0-hadoop3.2
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped

    depends_on:
      - spark-master

    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: 768m

    volumes:
      - ./spark:/opt/project/spark:ro

    networks:
      - bigdata-net

volumes:
  hadoop_namenode:
  hadoop_datanode:
  event_data:
  stream_data:
  hbase_data:
  hbase_zookeeper_data:

networks:
  bigdata-net:
    driver: bridge